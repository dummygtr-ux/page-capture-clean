<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page Capture</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
<header>
  <div class="title">
    <strong>Capture page</strong>
    <span id="page-domain" class="muted">…</span>
  </div>
  <button id="open-shortcuts" class="ghost" title="Change the keyboard shortcut">⌨︎</button>
</header>

<div class="controls">
  <label>
    <span>Format</span>
    <select id="format">
      <option value="md-lean">Markdown (lean — fewest tokens)</option>
      <option value="md-llm">Markdown (with link/image URLs)</option>
      <option value="md-doc">Markdown (with front matter)</option>
      <option value="json">JSON structure</option>
      <option value="text">Plain text</option>
      <option value="html">Clean HTML</option>
      <option value="styled">Styled HTML (keeps visual formatting)</option>
      <option value="report">Structure report (tuning)</option>
    </select>
  </label>
  <label>
    <span>Scope</span>
    <select id="scope">
      <option value="content">Main content</option>
      <option value="page">Whole page</option>
      <option value="selection">Selection</option>
    </select>
  </label>
  <label class="wide">
    <span>Hidden content in the DOM</span>
    <select id="include-hidden">
      <option value="mark">Include and label it (recommended)</option>
      <option value="off">Ignore it</option>
      <option value="all">Include everything (also aria-hidden)</option>
    </select>
  </label>
</div>

<section class="preview-wrap">
  <div class="preview-head">
    <span id="stats" class="muted">capturing…</span>
    <span id="scope-note" class="pill hidden"></span>
  </div>
  <textarea id="preview" readonly spellcheck="false" aria-label="Captured content preview"></textarea>
</section>

<footer>
  <button id="copy" class="primary">Copy</button>
  <button id="download">Save file</button>
  <span id="status" class="muted"></span>
</footer>

<script src="popup.js"></script>
</body>
</html>
